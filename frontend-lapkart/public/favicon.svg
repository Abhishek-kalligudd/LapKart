<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Screen Lid -->
  <rect x="15" y="14" width="34" height="23" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="1.6" filter="url(#glow)"/>
  
  <!-- Vibrant Gradient Screen Display -->
  <rect x="18" y="17" width="28" height="17" rx="1.5" fill="url(#screenGrad)"/>

  <!-- Screen Content / LK Monogram Geometry -->
  <path d="M22 21 L22 30 L27 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 21 L31 25.5 L36 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="37" cy="22" r="1" fill="#38bdf8"/>

  <!-- Webcam Dot -->
  <circle cx="32" cy="15.5" r="0.75" fill="#38bdf8"/>

  <!-- Laptop Base Chassis -->
  <path d="M10 40 L54 40 C55.5 40 56.6 41.2 56 42.5 L53.5 46.5 C53 47.5 52 48 50.8 48 L13.2 48 C12 48 11 47.5 10.5 46.5 L8 42.5 C7.4 41.2 8.5 40 10 40 Z" fill="#111827" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Trackpad Notch with Cyan Accent -->
  <rect x="26" y="41" width="12" height="2.5" rx="1.25" fill="#38bdf8" opacity="0.9"/>
</svg>
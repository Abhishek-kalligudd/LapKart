  <!-- Minimal Laptop Keyboard Base Chassis -->
  <path d="M9 41 L55 41 C56.5 41 57.4 42 56.8 43.2 L54.5 47.8 C54.1 48.6 53.2 49 52.2 49 L11.8 49 C10.8 49 9.9 48.6 9.5 47.8 L7.2 43.2 C6.6 42 7.5 41 9 41 Z" fill="#ffffff"/>

